<title>Doni Flap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: slim top bar (name, shop, sound), one stage filling the rest with the canvas fitted to 3:5,
   and a shop dialog laid over everything. Single-look game by choice: bright sky world, every color explicit. */
:root {
  --sky-low: #e3f6ff;
  --ink: #2a1a2e;
  --coral: #ff7a59;
  --leaf: #3a9a6c;
  --paper: #fff8ec;
  --prime-bg: #0d1020;
  --prime-fg: #e8f7ff;
  --prime-glow: #35f2ff;
  --font-display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 0;
  overflow: hidden;
  padding: 0;
  background: #fff;
  color: var(--ink);
  font-family: var(--font-body);
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bar h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; letter-spacing: 0.02em; line-height: 1.1; }
.actions { display: flex; align-items: center; gap: 8px; }
.btn {
  font: 800 0.85rem/1 var(--font-body);
  color: var(--ink);
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 9px 14px;
  cursor: pointer;
}
.btn:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--coral); color: #fff; }
.stage {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}
.stage:focus { outline: none; }
#game { display: block; border: 0 !important; outline: 0 !important; border-radius: 0; box-shadow: none !important; background: #fff; }
.stage, #stage { border: 0 !important; outline: 0 !important; box-shadow: none !important; overflow: hidden; }

/* shop */
.shop {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(42, 26, 46, 0.58);
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.shop-panel {
  width: min(100%, 560px);
  max-height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 20px;
  overflow: hidden;
}
.shop-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 3px solid var(--ink); }
.shop-head h2 { margin: 0; flex: 1; font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; line-height: 1.1; }
.wallet { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; }
.coin-dot {
  display: inline-block;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid var(--ink);
  background: radial-gradient(circle at 35% 30%, #fff3a8, #f5b82e 60%, #d8920c);
  flex: none;
}
.shop-body { overflow: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 10px;
  min-width: 0;
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: 14px;
}
.card.on { box-shadow: 0 0 0 3px var(--coral); }
#inv .shop-panel { background: linear-gradient(160deg,#fff8ec,#f0e4cf); }
#inv .shop-body { grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap:14px; padding:16px; }
#inv .card { background:rgba(255,255,255,.88); border:0; border-radius:18px; box-shadow:0 4px 14px rgba(42,26,46,.12); padding:14px; }
#inv .card.on { outline:3px solid var(--coral); box-shadow:0 5px 18px rgba(255,122,89,.24); }
#inv .card canvas { border-radius:16px; }
#inv .info { gap:9px; }
.card canvas { display: block; flex: none; border-radius: 12px; }
.card .info { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; min-width: 0; }
.card h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; line-height: 1.15; text-align: center; }
.card .desc { margin: 0; font-size: 0.85rem; font-weight: 700; line-height: 1.3; opacity: 0.85; }
.card .price { margin: 0; display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
  .card .old-price { color: #a06464; text-decoration: line-through; font-size: .85rem; opacity: .85; }
  .card .sale-tag { color: #c83232; font-size: .78rem; font-weight: 900; }
.card .btn { width: 100%; }
.card.prime {
  grid-column: 1 / -1;
  flex-direction: row;
  gap: 14px;
  padding: 12px;
  background: var(--prime-bg);
  color: var(--prime-fg);
  border-color: var(--prime-glow);
}
.card.prime.on { box-shadow: 0 0 0 3px var(--prime-glow); }
.card.prime .info { align-items: flex-start; text-align: left; }
.card.prime h3 { text-align: left; font-size: 1.35rem; }
.card.prime .btn { background: transparent; color: var(--prime-fg); border-color: var(--prime-fg); }
.card.prime .btn.primary { background: var(--prime-glow); color: #06121f; border-color: var(--prime-glow); }
.card.prime .btn:focus-visible { outline-color: var(--prime-glow); }
.wallet .piggy { display: block; }
.tabs { display: flex; border-bottom: 3px solid var(--ink); }
.tab {
  flex: 1;
  font: 800 0.95rem/1 var(--font-body);
  color: var(--ink);
  background: transparent;
  border: 0;
  padding: 13px 10px;
  cursor: pointer;
}
.tab + .tab { border-left: 3px solid var(--ink); }
.tab[aria-selected="true"] { background: var(--coral); }
.tab:focus-visible { outline: 3px solid var(--ink); outline-offset: -6px; }
.upgrade { display: flex; flex-direction: column; gap: 12px; }
.card.boost { align-items: stretch; gap: 10px; padding: 14px; }
.boost-head { display: flex; align-items: center; gap: 14px; min-width: 0; }
.boost-head h3 { text-align: left; font-size: 1.35rem; }
.boost-head .desc { margin-top: 2px; }
.boost-coin {
  flex: none;
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 3px solid var(--ink);
  background: radial-gradient(circle at 35% 30%, #fff3a8, #f5b82e 60%, #d8920c);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.5rem;
}
.card.boost .rate { margin: 0; font-weight: 800; font-size: 0.95rem; }
.card.boost .rate.next { opacity: 0.7; }
.card.boost .lvl { margin: 0; font-weight: 800; font-size: 0.85rem; }
.card.boost .price { justify-content: flex-start; }
.levels { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; width: 100%; }
.levels i { display: block; height: 12px; background: #fff; border: 1.5px solid var(--ink); border-radius: 3px; }
.levels i.on { background: var(--coral); }
.note { margin: 0; font-size: 0.82rem; font-weight: 700; line-height: 1.35; opacity: 0.75; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.perk { margin: 0; font-weight: 800; font-size: 0.85rem; line-height: 1.3; color: #d4492a; text-align: center; }
.card.prime .perk { color: var(--prime-glow); text-align: left; }
.card.prime .perk + .desc, .card.prime .desc { text-align: left; }
.menu {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(90deg, rgba(0,0,0,.70), rgba(0,0,0,.22)), url("data:image/jpeg;base64,UklGRpjzAQBXRUJQVlA4WAoAAAAgAAAAzAQA/wUASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADZWUDggqvEBAHAGDJ0BKs0EAAY+bTKURyQjJKUqU7q4oA2JZ23fuE8nCpo+Bp1obSuindYIqqorfmZ9E/wnhH/d+Gj6f/ivYE/Xb0uP+HvXvH/7/2Bf2j8pfm3+33Ua/8voxUiP+nyx/bGCzay63ukv99IXlPjw6NWcTzhnH+3/8n7w9l3qo/o29T5v/2pQt/8g/8HnG+Y/33g3+c+lB+7n+P+Wf+u0P+5+EH3+fq/6X2hd5P1R1OPef/L+4b5l/6vIOAp+xcYn6t5xv8RzSH770jPRv+/n/i+zv7P/+H+19pEySpxDWBnCNS7kxycQNGcI1LspSlDWBnDqXdy9O6mN4ne0dGEu5enix+eqXcvTxY/PVLuXp4sfqowWHylG0Hc0vMRpEuFOIH96ulDK2vX/QLl+2LENflxXxxTOhEuOwPJLuXuffcvTxY/DpG7ky3/uw74wfJARSCgqzQOOew0sqTA45mCFhhewXTxrgJb6JdBXDCi9VYaOFyu+VNezzJOzLatU4KxfE1kL9McStzsJYZ69K3QBjjq1mK6FlNSIEd5QWdx2nOCnFZiL7l6epcI+sY4Q7qnc/SBO91jAzenhyPmfqV/A2blWgJv+lLaea0I1SualBFcONS+/qmt/bw2WEUOHxxPrjk0vw9JKzdwZeM5gZt3tLhIKfbq5xDIWD1uIiCE8jUPEKvABtFUaEe78FYhVVk6nBHVaykHXGjr9hXTpcKbrMstLEeMCpJ9I43S4/3Ht22BO90AQM5O1mbjHsfZSlLf1zG2cz3PNSuzhPI5WJ4unE0RfgzYnZjZave7e2ileC6eGVmXC+wOjQ/cajyslpYh38SdYNVXy7spRYogNgCH3EoWKAaFziuJZXib2bjopv68bhXAA6q+roWWr2IO33Sq97R7z2+e8rB3X4Yg8uUdE6Qlqsh81uqq56Bse6vTzYk2VaX9qOVWbdA6/zv1NHaa4g4K/usxt7hgA3ZXCxGdMV6ReMV3oxykcmAAduWDdGqXAi82ActBJJh38vInoTC1TzTmgSIQAbMFIF8de9LYtnqkax/7o+X+qzuCphqXH9KRJaJH5d5Onu1eNyroUr+36P7O4qggpNohiJxPx+R/cQUvPcjoDZP6q5gGFnLaxVO0BC3cxFdqG7nf3aqNP8IGd5/xOac0xaDtaZm/lxpztOonlQyDOMI9jACHUC5awcACyUp9baewRC/Txs+wXNxsrGGpDbigvOrxqfCmG   function updateKetchup(dt) {

  // ---- spawning ----
  function spawnPipe() {
    const lo = GAP / 2 + 60, hi = H - GROUND - GAP / 2 - 60;
    const gap = lo + Math.random() * (hi - lo);
    const x = W + 10;
    const prev = pipes[pipes.length - 1];
    pipes.push({ x, gap, scored: false });
    // one coin inside every gap, a second one on the way between pipes sometimes
    coins.push({ x: x + PIPE_W / 2, y: gap + (Math.random() - 0.5) * (GAP - 70), ph: Math.random() * TAU, taken: false });
    if (prev && Math.random() < 0.45) {
      coins.push({ x: (prev.x + x) / 2 + PIPE_W / 2, y: (prev.gap + gap) / 2, ph: Math.random() * TAU, taken: false });
    }
  }

  function updateBoss(dt) {
    if (boss.ph === 'off') return;
    boss.t += dt;
    const baseX = W - 72;
    if (boss.ph === 'wait') {
      if (boss.t >= 1) { boss.ph = 'in'; boss.t = 0; boss.x = W + 140; boss.y = H * 0.4; }
    } else if (boss.ph === 'in') {
      boss.x += (baseX - boss.x) * Math.min(1, dt * 3);
      boss.y = H * 0.4 + Math.sin(boss.t * 2) * 40;
      if (boss.t >= 1.4) { boss.ph = 'attack'; boss.t = 0; boss.nextT = 0.8; boss.throws = 0; }
    } else if (boss.ph === 'attack') {
      boss.x = baseX + Math.sin(boss.t * 2.2) * 6;
      const want = clamp(doni.y, 90, H - GROUND - 90);
      boss.y += clamp(want - boss.y, -110 * dt, 110 * dt);
      boss.nextT -= dt;
      boss.wind = boss.nextT < 0.4 ? 1 - boss.nextT / 0.4 : 0;
      if (boss.nextT <= 0) {
        franks.push({ x: boss.x - 66, y: boss.y + 8, vx: -200 });

        boss.wind = 0;
        if (boss.throws >= BOSS_THROWS) { boss.ph = 'out'; boss.t = 0; }

    } else if (boss.ph === 'out') {
      boss.x += 280 * dt;

  function pickHop2() {
    boss2.sx = boss2.x; boss2.sy = boss2.y;
    boss2.tx = W - 125 + Math.random() * 55;
    const lo = 130, hi = H - GROUND - 90;
    let ty;
    do { ty = lo + Math.random() * (hi - lo); } while (Math.abs(ty - boss2.sy) < 80);
    boss2.ty = ty; boss2.u = 0; boss2.fired = false;
  }
  function fireGoos(n) {
    const base = Math.atan2(doni.y - boss2.y, DONI_X - boss2.x);
    for (let k = 0; k < n; k++) {
      const a = base + (n === 1 ? 0 : (k - (n - 1) / 2) * 0.2);
      goos.push({ x: boss2.x - 34, y: boss2.y + 4, vx: Math.cos(a) * 185, vy: Math.sin(a) * 185, ph: Math.random() * TAU });
    }

  function updateBoss2(dt) {
    if (boss2.ph === 'off') return;
    boss2.t += dt;
    if (boss2.open > 0) boss2.open = Math.max(0, boss2.open - dt * 3);
    if (boss2.ph === 'wait') {
      if (boss2.t >= 1) { boss2.ph = 'in'; boss2.t = 0; boss2.x = W + 200; boss2.y = -160; }
    } else if (boss2.ph === 'in') {
      const u = Math.min(1, boss2.t / 1.5), e = 1 - Math.pow(1 - u, 3);
      boss2.x = (W + 200) + (W - 95 - (W + 200)) * e;
      boss2.y = -160 + (H * 0.38 + 160) * e;
      if (u >= 1) { boss2.ph = 'attack'; boss2.t = 0; boss2.wave = 0; boss2.jump = 0; boss2.rest = 0.8; boss2.u = 1; shake = 0.3; }

        boss2.x = boss2.sx + (boss2.tx - boss2.sx) * u;
        boss2.y = boss2.sy + (boss2.ty - boss2.sy) * u - Math.sin(u * Math.PI) * 70;
        if (!boss2.fired && u >= 0.5) { boss2.fired = true; fireGoos(BOSS2_WAVES[boss2.wave].shots); }
        if (boss2.u >= 1) {

  // ---- update ----
  function update(dt) {
    time += dt;
    if (flapT > 0) flapT -= dt;
    if (shake > 0) shake -= dt;
    if (flash > 0) flash -= dt;
    if (invuln > 0) invuln -= dt;
    for (const p of pops) p.t += dt;
    pops = pops.filter((p) => p.t < 0.7);
    updateKetchup(dt);
    piggyBounce = Math.max(0, piggyBounce - dt * 5);

    if (state !== 'dead') {
      scroll += SPEED * dt;
      for (const c of clouds) {
        c.x -= 20 * c.s * dt;
        if (c.x < -90) c.x = W + 60;
      }
    }
    phase += dt * (state === 'dead' ? 0 : (flapT > 0 ? 26 : (state === 'ready' ? 9 : 6)));

    if (state === 'ready') {
      doni.y = BASE_Y + Math.sin(time * 3.2) * 8;
      doni.rot = Math.sin(time * 3.2) * 0.05;
      return;
    }

    if (state === 'playing') {
      if (boss3.phase !== 'off') { boss3.t += dt;
        if (boss3.phase === 'wait' && boss3.t >= 0.7) { boss3.phase='enter'; boss3.t=0; boss3.x=W+260; }
        else if (boss3.phase==='enter') { boss3.x += (W*0.72-boss3.x)*Math.min(1,dt*2.8); boss3.y=H*0.38+Math.sin(time*2)*10; if(boss3.x<=W*0.73){boss3.phase='approach';boss3.t=0;} }
        else if(boss3.phase==='approach'){boss3.x+=(DONI_X-boss3.x+35)*Math.min(1,dt*1.8);boss3.y+=(doni.y-boss3.y)*Math.min(1,dt*1.5);if(boss3.t>=2.2){boss3.phase='eat';boss3.t=0;}}
        else if(boss3.phase==='eat'&&boss3.t>=1.5){boss3.phase='fade';boss3.t=0;}
        else if(boss3.phase==='fade'&&boss3.t>=2){boss3.phase='world';boss3.t=0;}
        else if(boss3.phase==='world'&&boss3.t>=2){boss3.done=true;boss3.phase='done';} return; }
      doni.vy += GRAVITY * dt;
      doni.y += doni.vy * dt;
      if (doni.y < DONI_R) { doni.y = DONI_R; if (doni.vy < 0) doni.vy = 0; }
      const target = clamp(doni.vy * 0.0021, -0.45, 1.25);
      doni.rot += (target - doni.rot) * Math.min(1, dt * 12);

      for (const p of pipes) p.x -= SPEED * dt;
      for (const c of coins) c.x -= SPEED * dt;
      pipes = pipes.filter((p) => p.x > -PIPE_W - 20);
      coins = coins.filter((c) => c.x > -30);
      if (!boss.done && boss.ph === 'off' && score >= BOSS_SCORE) { boss.ph = 'wait'; boss.t = 0; }
      if (!boss2.done && boss2.ph === 'off' && boss.ph === 'off' && score >= BOSS2_SCORE) { boss2.ph = 'wait'; boss2.t = 0; }
      if (boss3.phase==='off' && score>=80) { boss3.phase='wait'; boss3.t=0; pipes=[]; coins=[]; }
      if (boss3.phase==='off' && boss.ph==='off' && boss2.ph==='off' && (!pipes.length || pipes[pipes.length-1].x<=W-SPACING)) spawnPipe();

      const reach = (DONI_R * 0.95 + COIN_R) * (DONI_R * 0.95 + COIN_R);
      for (const c of coins) {
        if (c.taken) continue;
        const dx = c.x - DONI_X, dy = c.y - doni.y;
        if (dx * dx + dy * dy < reach) { c.taken = true; collect(c); }
      }
      coins = coins.filter((c) => !c.taken);

      const hr = DONI_R * 0.82;
      const hit = (x, y, w, h) => doni.y + hr > y && doni.y - hr < y + h && DONI_X + hr > x && DONI_X - hr < x + w;
      for (const p of pipes) {
        const top = p.gap - GAP / 2, bot = p.gap + GAP / 2;
        if (invuln <= 0 && (hit(p.x, -50, PIPE_W, top + 50) || hit(p.x, bot, PIPE_W, H) ||
            hit(p.x - 4, top - CAP_H, PIPE_W + 8, CAP_H) || hit(p.x - 4, bot, PIPE_W + 8, CAP_H))) {
          hurt(false);
          if (state === 'dead') break;
        }
        if (!p.scored && p.x + PIPE_W < DONI_X - hr) {
          p.scored = true;
          score++;
          sfx.score();
        }
      }
      updateBoss(dt);
      for (const f of franks) {
        f.x += f.vx * dt;
        if (state === 'playing' && invuln <= 0 && hit(f.x - 17, f.y - 7, 34, 14)) { f.dead = true; hurt(false); }
      }
      franks = franks.filter((f) => !f.dead && f.x > -50);
      updateBoss2(dt);
      for (const g of goos) {
        g.x += g.vx * dt; g.y += g.vy * dt;
        if (state === 'playing' && invuln <= 0 && hit(g.x - 8, g.y - 8, 16, 16)) { g.dead = true; hurt(false); }
      }
      goos = goos.filter((g) => !g.dead && g.x > -40 && g.x < W + 60 && g.y > -40 && g.y < H - GROUND + 10);
      if (state === 'playing' && doni.y + DONI_R >= H - GROUND) {
        hurt(true);
      }
      return;
    }

    // dead: fall to the ground
    deadT += dt;
    doni.vy += GRAVITY * dt;
    doni.y += doni.vy * dt;
    if (doni.y >= H - GROUND - DONI_R) { doni.y = H - GROUND - DONI_R; doni.vy = 0; }
    doni.rot += (1.35 - doni.rot) * Math.min(1, dt * 8);
  }

  // ---- drawing helpers ----
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function outText(str, x, y, size, fill, lw, align) {
    ctx.font = size + 'px ' + FONT;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.lineJoin = 'round';
    ctx.lineWidth = lw || 6;
    ctx.strokeStyle = INK;
    ctx.strokeText(str, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }

  function hills(off, amp, base, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, H - GROUND);
    for (let x = 0; x <= W; x += 6) {
      const y = base - (Math.sin((x + off) * 0.013) * amp + Math.sin((x + off) * 0.034) * amp * 0.4);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H - GROUND);
    ctx.closePath();
    ctx.fill();
  }

  function cloud(c) {
    const s = c.s;
    ctx.fillStyle = 'rgba(255,255,255,0.93)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, 18 * s, 0, TAU);
    ctx.arc(c.x + 22 * s, c.y - 8 * s, 23 * s, 0, TAU);
    ctx.arc(c.x + 46 * s, c.y, 17 * s, 0, TAU);
    ctx.rect(c.x, c.y - 2 * s, 46 * s, 17 * s);
    ctx.fill();
  }

  function pipeBlock(x, y, w, h) {
    ctx.fillStyle = C.leaf;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(x + 6, y, 8, h);
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(x + w - 13, y, 8, h);
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'miter';
    ctx.strokeRect(x, y, w, h);
  }

  function coinIcon(x, y, r, sx) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sx, 1);
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#fff3a8');
    g.addColorStop(0.6, '#f5b82e');
    g.addColorStop(1, '#d8920c');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, TAU);
    ctx.fill();
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = INK;
    ctx.stroke();
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = 'rgba(138,84,0,0.75)';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.58, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  function piggy(x, y, squash) {
    ctx.save();
    ctx.translate(x, y + 14);
    ctx.scale(1 + squash * 0.14, 1 - squash * 0.14);
    ctx.translate(0, -14);
    ctx.lineWidth = 2.2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = INK;
    ctx.beginPath();
    ctx.moveTo(-14, -2);
    ctx.quadraticCurveTo(-23, -7, -19, 0);
    ctx.stroke();
    ctx.fillStyle = '#f08fb0';
    rr(-10, 7, 7, 7, 2); ctx.fill(); ctx.stroke();
    rr(4, 7, 7, 7, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffadc9';
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 12, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#f58fb2';
    ctx.beginPath();
    ctx.moveTo(5, -10); ctx.lineTo(11, -18); ctx.lineTo(14, -8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ff8fb5';
    ctx.beginPath();
    ctx.ellipse(15, 1, 5, 4.2, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(13.5, 1, 0.9, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(16.5, 1, 0.9, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -3, 1.7, 0, TAU); ctx.fill();
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-7, -11); ctx.lineTo(2, -11);
    ctx.stroke();
    ctx.restore();
  }

  // ---- Doni drawing ----
  function wing(px, py, ang, s, fill) {
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(ang);
    ctx.scale(s, s);
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(0, -4);
    ctx.bezierCurveTo(-10, -14, -27, -12, -32, -2);
    ctx.bezierCurveTo(-27, 3, -20, 9, -8, 7);
    ctx.bezierCurveTo(-4, 6, -1, 4, 0, 4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-12, -4); ctx.lineTo(-25, -3);
    ctx.moveTo(-10, 1); ctx.lineTo(-21, 3);
    ctx.stroke();
    ctx.restore();
  }

  function primeWing(px, py, ang, s, alpha) {
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(ang);
    ctx.scale(s, s);
    ctx.globalAlpha = alpha;
    const g = ctx.createLinearGradient(0, 0, -36, 0);
    g.addColorStop(0, '#35f2ff');
    g.addColorStop(1, '#8a5cff');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -3);
    ctx.lineTo(-12, -13);
    ctx.lineTo(-23, -12);
    ctx.lineTo(-17, -6);
    ctx.lineTo(-33, -5);
    ctx.lineTo(-22, 0);
    ctx.lineTo(-34, 5);
    ctx.lineTo(-17, 6);
    ctx.lineTo(-8, 9);
    ctx.lineTo(0, 4);
    ctx.closePath();
    ctx.fill();
    ctx.shadowColor = '#35f2ff';
    ctx.shadowBlur = 8;
    ctx.strokeStyle = '#c9fbff';
    ctx.lineWidth = 1.3;
    ctx.stroke();
    ctx.restore();
  }

  function drawPrime(ph, dead) {
    const cy = '#35f2ff', vi = '#8a5cff', mg = '#ff3fd2';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    primeWing(-4, -4, -0.1 + Math.sin(ph + 1.3) * 0.85, 0.85, 0.55);

    // crest fins
    ctx.save();
    ctx.shadowColor = cy;
    ctx.shadowBlur = 8;
    ctx.fillStyle = cy;
    ctx.beginPath();
    ctx.moveTo(-6, -15); ctx.lineTo(-2, -28); ctx.lineTo(3, -16);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = vi;
    ctx.beginPath();
    ctx.moveTo(2, -16); ctx.lineTo(8, -24); ctx.lineTo(10, -14);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // body
    const bg = ctx.createLinearGradient(0, -17, 0, 17);
    bg.addColorStop(0, '#343d68');
    bg.addColorStop(0.55, '#161b32');
    bg.addColorStop(1, '#080a15');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.ellipse(0, 0, 19, 17, 0, 0, TAU);
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.lineWidth = 3;
    ctx.strokeStyle = mg;
    ctx.beginPath();
    ctx.moveTo(-20, 6); ctx.quadraticCurveTo(0, 13, 20, 3);
    ctx.stroke();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = cy;
    ctx.beginPath();
    ctx.moveTo(-20, 11); ctx.quadraticCurveTo(0, 18, 20, 8);
    ctx.stroke();
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(-6, 1, 3.4, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = cy;
    ctx.beginPath();
    ctx.arc(-6, 1, 1.4, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.shadowColor = cy;
    ctx.shadowBlur = 9;
    ctx.strokeStyle = cy;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 19, 17, 0, 0, TAU);
    ctx.stroke();
    ctx.restore();

    // visor
    ctx.save();
    ctx.translate(8, -5);
    ctx.rotate(-0.1);
    rr(-9, -5.5, 18, 11, 5.5);
    ctx.fillStyle = dead ? '#2a0610' : '#050913';
    ctx.fill();
    if (!dead) {
      const vg = ctx.createLinearGradient(-9, 0, 9, 0);
      vg.addColorStop(0, 'rgba(53,242,255,0.38)');
      vg.addColorStop(1, 'rgba(255,63,210,0.38)');
      ctx.fillStyle = vg;
      ctx.fill();
    }
    ctx.shadowColor = dead ? '#ff5c7a' : cy;
    ctx.shadowBlur = 7;
    ctx.strokeStyle = dead ? '#ff5c7a' : cy;
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.shadowBlur = 0;
    if (dead) {
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-5, -2.5); ctx.lineTo(-1, 2.5);
      ctx.moveTo(-1, -2.5); ctx.lineTo(-5, 2.5);
      ctx.moveTo(2, -2.5); ctx.lineTo(6, 2.5);
      ctx.moveTo(6, -2.5); ctx.lineTo(2, 2.5);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#c9fbff';
      rr(-5, -2.8, 3.4, 5.6, 1.7);
      ctx.fill();
      rr(1.6, -2.8, 3.4, 5.6, 1.7);
      ctx.fill();
    }
    ctx.restore();

    primeWing(-3, 3, -0.3 + Math.sin(ph) * 0.9, 1, 0.95);
  }

  function drawSquint(ph, dead) {
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    const skin = '#f2a58c', skinDark = '#d9806a';

    wing(-4, -4, -0.1 + Math.sin(ph + 1.3) * 0.85, 0.85, '#dfe9f2');

    if (faceImg.complete && faceImg.naturalWidth) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, 19.5, 0, TAU);
      ctx.clip();
      ctx.drawImage(faceImg, -19.5, -19.5, 39, 39);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(0, 0, 19.5, 0, TAU);
      ctx.lineWidth = 2.6;
      ctx.stroke();
      wing(-3, 3, -0.3 + Math.sin(ph) * 0.9, 1, '#ffffff');
      return;
    }

    // face
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.ellipse(0, 0, 19, 17, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();

    // cheeks
    ctx.fillStyle = 'rgba(255,90,100,0.45)';
    ctx.beginPath(); ctx.arc(-10, 6, 4.2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(13, 6, 4.2, 0, TAU); ctx.fill();

    // short dark hair with fringe
    ctx.fillStyle = '#3a2a24';
    ctx.beginPath();
    ctx.moveTo(-18, -4);
    ctx.bezierCurveTo(-22, -22, 20, -26, 18.5, -4);
    ctx.lineTo(14, -10);
    ctx.lineTo(9, -6);
    ctx.lineTo(3, -11);
    ctx.lineTo(-3, -6);
    ctx.lineTo(-9, -10);
    ctx.lineTo(-13, -5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // nose
    ctx.fillStyle = skinDark;
    ctx.beginPath(); ctx.ellipse(5, 3, 3.2, 2.4, 0, 0, TAU); ctx.fill();

    if (dead) {
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(-10, -5); ctx.lineTo(-3, 1);
      ctx.moveTo(-3, -5); ctx.lineTo(-10, 1);
      ctx.moveTo(6, -5); ctx.lineTo(13, 1);
      ctx.moveTo(13, -5); ctx.lineTo(6, 1);
      ctx.stroke();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.ellipse(5, 11, 4, 3.2, 0, 0, TAU); ctx.fill();
    } else {
      // left (big) eye, pupil squeezed into the corner
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(-6.5, -2, 5.6, 3.4, 0.12, 0, TAU); ctx.fill();
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(-9.6, -1.6, 2.4, 0, TAU); ctx.fill();
      // right (squinting) eye, narrow
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(9.5, 0, 4.8, 2.1, 0.12, 0, TAU); ctx.fill();
      ctx.stroke();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(8.4, 0.2, 1.7, 0, TAU); ctx.fill();
      // eyebrows
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(-12, -7); ctx.quadraticCurveTo(-6, -10, -1, -6.5);
      ctx.moveTo(5, -4); ctx.quadraticCurveTo(10, -6.5, 15, -3.5);
      ctx.stroke();
      // big toothy grin
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(-5, 8);
      ctx.quadraticCurveTo(4, 17, 14, 8);
      ctx.quadraticCurveTo(4, 9.5, -5, 8);
      ctx.closePath();
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(-0.5, 9.2); ctx.lineTo(-0.5, 12.6);
      ctx.moveTo(4, 9.6); ctx.lineTo(4, 13.6);
      ctx.moveTo(8.5, 9.2); ctx.lineTo(8.5, 12.6);
      ctx.stroke();
    }

    ctx.lineWidth = 2.6;
    wing(-3, 3, -0.3 + Math.sin(ph) * 0.9, 1, '#ffffff');
  }

  function starPath(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r;
      ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    ctx.closePath();
  }

  function flowerAt(x, y, r, petal) {
    ctx.save();
    ctx.translate(x, y);
    ctx.lineWidth = 1.2;
    ctx.fillStyle = petal;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * TAU;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r * 0.9, Math.sin(a) * r * 0.9, r * 0.8, 0, TAU);
      ctx.fill();
      ctx.stroke();
    }
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.6, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawAcc(a) {
    ctx.save();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = INK;
    if (a === 'leaf') {
      for (const [x, y, r] of [[-6, -22, -0.8], [5, -23, 0.5]]) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(r);
        ctx.fillStyle = '#5fd3a8';
        ctx.beginPath(); ctx.ellipse(0, 0, 7.5, 3.6, 0, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.stroke();
        ctx.restore();
      }
    } else if (a === 'lemon') {
      ctx.translate(-9, -21);
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff4bf';
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.fill();
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        const t = (i / 3) * Math.PI;
        ctx.moveTo(Math.cos(t) * 5, Math.sin(t) * 5); ctx.lineTo(-Math.cos(t) * 5, -Math.sin(t) * 5);
      }
      ctx.stroke();
    } else if (a === 'stars') {
      ctx.fillStyle = '#ffe27a';
      starPath(-9, -23, 7); ctx.fill(); ctx.stroke();
      starPath(8, -24, 4.5); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4;
      sparkle(-17, -8, 2.6);
    } else if (a === 'flower') {
      flowerAt(-12, -17, 3.4, '#ffc4de');
      flowerAt(-2, -22, 3.8, '#fff');
      flowerAt(8, -19, 3.2, '#ffc4de');
    } else if (a === 'shine') {
      ctx.fillStyle = '#f5b82e';
      ctx.beginPath();
      ctx.moveTo(-9, -19); ctx.lineTo(-10, -31); ctx.lineTo(-4.5, -25); ctx.lineTo(0, -33);
      ctx.lineTo(4.5, -25); ctx.lineTo(10, -31); ctx.lineTo(9, -19);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff5c7a';
      ctx.beginPath(); ctx.arc(0, -23, 1.8, 0, TAU); ctx.fill();
    } else if (a === 'snow') {
      ctx.translate(-9, -22);
      for (const [w, col] of [[4.2, INK], [2.2, '#8fd8ff']]) {
        ctx.strokeStyle = col; ctx.lineWidth = w;
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
          const t = (i / 3) * Math.PI;
          ctx.moveTo(Math.cos(t) * 7, Math.sin(t) * 7); ctx.lineTo(-Math.cos(t) * 7, -Math.sin(t) * 7);
        }
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawPhotoDoni(sk, ph) {
    const sq = sk.style === 'squint';
    wing(-4, -4, -0.1 + Math.sin(ph + 1.3) * 0.85, 0.85, sq ? '#dfe9f2' : sk.wingBack);
    if (!sq) {
      ctx.beginPath(); ctx.arc(0, 0, 22.8, 0, TAU);
      ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 21.2, 0, TAU);
      ctx.fillStyle = sk.body; ctx.fill();
    }
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, 19.5, 0, TAU); ctx.clip();
    ctx.drawImage(faceImg, -19.5, -19.5, 39, 39);
    ctx.restore();
    ctx.beginPath(); ctx.arc(0, 0, 19.5, 0, TAU);
    ctx.lineWidth = 2.4; ctx.strokeStyle = INK; ctx.stroke();
    if (sk.accessory) drawAcc(sk.accessory);
    ctx.lineWidth = 2.6; ctx.strokeStyle = INK;
    wing(-3, 3, -0.3 + Math.sin(ph) * 0.9, 1, sq ? '#ffffff' : sk.wing);
  }

  function drawDoniFace(sk, ph, dead) {
    wing(-4, -4, -0.1 + Math.sin(ph + 1.3) * 0.85, 0.85, sk.wingBack);
    // colored ring in the skin's color
    ctx.beginPath(); ctx.arc(0, 0, 22.8, 0, TAU);
    ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 21.2, 0, TAU);
    ctx.fillStyle = sk.body; ctx.fill();
    // face
    ctx.beginPath(); ctx.arc(0, 0, 19.5, 0, TAU);
    ctx.fillStyle = '#f4b093'; ctx.fill();
    ctx.lineWidth = 2.4; ctx.strokeStyle = INK; ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, 19.5, 0, TAU); ctx.clip();
    // hair
    ctx.fillStyle = '#3a2a24';
    ctx.beginPath();
    ctx.moveTo(-21, -2);
    ctx.lineTo(-21, -22); ctx.lineTo(21, -22); ctx.lineTo(21, -2);
    ctx.lineTo(16, -8); ctx.lineTo(11, -4); ctx.lineTo(5, -10); ctx.lineTo(-1, -5);
    ctx.lineTo(-7, -10); ctx.lineTo(-12, -5); ctx.lineTo(-16, -8);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    // cheeks + nose
    ctx.fillStyle = 'rgba(255,90,100,0.45)';
    ctx.beginPath(); ctx.arc(-11, 7, 4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(12, 7, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#dd8a73';
    ctx.beginPath(); ctx.ellipse(1, 4, 3.2, 2.4, 0, 0, TAU); ctx.fill();
    if (dead) {
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(-10, -3); ctx.lineTo(-3, 3);
      ctx.moveTo(-3, -3); ctx.lineTo(-10, 3);
      ctx.moveTo(5, -3); ctx.lineTo(12, 3);
      ctx.moveTo(12, -3); ctx.lineTo(5, 3);
      ctx.stroke();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.ellipse(1, 12, 4, 3.2, 0, 0, TAU); ctx.fill();
    } else {
      ctx.lineWidth = 1.8;
      for (const ex of [-6.5, 8.5]) {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(ex, -1, 4.4, 3.8, 0, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle = INK;
        ctx.beginPath(); ctx.arc(ex + 1.2, -0.6, 2, 0, TAU); ctx.fill();
      }
      // grin
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(-6, 9); ctx.quadraticCurveTo(1, 17, 9, 9); ctx.quadraticCurveTo(1, 10.5, -6, 9);
      ctx.closePath(); ctx.fill(); ctx.lineWidth = 1.8; ctx.stroke();
    }
    if (sk.accessory) drawAcc(sk.accessory);
    ctx.lineWidth = 2.6; ctx.strokeStyle = INK;
    wing(-3, 3, -0.3 + Math.sin(ph) * 0.9, 1, sk.wing);
  }

  function sparkle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
    ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
    ctx.stroke();
  }

  function drawDoni(x, y, rot, ph, dead, skin) {
    const sk = skin || SKINS[0];
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.lineWidth = 2.6;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = INK;

    if (sk.style === 'prime') {
      drawPrime(ph, dead);
      ctx.restore();
      return;
    }
    if (sk.style === 'squint' && faceImg.complete && faceImg.naturalWidth) {
      drawPhotoDoni(sk, ph);
      ctx.restore();
      return;
    }
    if (sk.style !== 'squint') {
      drawDoniFace(sk, ph, dead);
      ctx.restore();
      return;
    }
    if (sk.style === 'squint') {
      drawSquint(ph, dead);
      ctx.restore();
      return;
    }

    wing(-4, -4, -0.1 + Math.sin(ph + 1.3) * 0.85, 0.85, sk.wingBack);

    ctx.fillStyle = sk.body;
    ctx.beginPath();
    ctx.ellipse(0, 0, 19, 17, 0, 0, TAU);
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = sk.belly;
    ctx.beginPath();
    ctx.ellipse(4, 8, 13, 10, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.beginPath();
    ctx.ellipse(0, 0, 19, 17, 0, 0, TAU);
    ctx.stroke();

    // hair tuft
    ctx.beginPath();
    ctx.moveTo(-3, -16); ctx.quadraticCurveTo(-8, -25, -1, -22);
    ctx.moveTo(2, -16); ctx.quadraticCurveTo(3, -27, 8, -21);
    ctx.stroke();

    if (sk.accessory) drawAcc(sk.accessory);

    ctx.fillStyle = sk.blush;
    ctx.beginPath();
    ctx.arc(9, 6, 3.6, 0, TAU);
    ctx.fill();

    if (dead) {
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(4, -9); ctx.lineTo(12, -1);
      ctx.moveTo(12, -9); ctx.lineTo(4, -1);
      ctx.stroke();
      ctx.lineWidth = 2.6;
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.ellipse(14, 7, 3, 3.6, 0, 0, TAU);
      ctx.fill();
    } else {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(8, -5, 6.2, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(10, -4.5, 3.1, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(11, -6, 1.1, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(13, 3, 3.4, 0.25, Math.PI - 0.5);
      ctx.stroke();
    }

    wing(-3, 3, -0.3 + Math.sin(ph) * 0.9, 1, sk.wing);
    ctx.restore();
  }

  // ---- render ----
  function drawFrank(f) {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(Math.sin(time * 10 + f.y) * 0.12);
    rr(-18, -7.5, 36, 15, 7.5);
    ctx.fillStyle = '#d4513f';
    ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-11, -2.5); ctx.lineTo(10, -2.5); ctx.stroke();
    ctx.restore();
  }

  function drawBoss() {
    if (boss.ph === 'off' || boss.ph === 'wait') return;
    const x = boss.x, y = boss.y, w = boss.wind;
    ctx.save();
    ctx.translate(x, y);
    ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = INK;
    // body
    rr(-34, 38, 110, 120, 22); ctx.fillStyle = '#3d6fd1'; ctx.fill(); ctx.stroke();
    // arm + sausage in fist (raised while winding up)
    const ax = -50 - w * 6, ay = 34 - w * 22;
    ctx.beginPath(); ctx.moveTo(-18, 56); ctx.lineTo(ax, ay); ctx.lineWidth = 14; ctx.strokeStyle = INK; ctx.stroke();
    ctx.lineWidth = 8; ctx.strokeStyle = '#3d6fd1'; ctx.stroke();
    ctx.lineWidth = 4; ctx.strokeStyle = INK;
    if (w > 0) { ctx.save(); ctx.translate(ax - 16, ay - 4); ctx.scale(1.2, 1.2); rr(-18, -7.5, 36, 15, 7.5); ctx.fillStyle = '#d4513f'; ctx.fill(); ctx.stroke(); ctx.restore(); }
    ctx.beginPath(); ctx.arc(ax, ay, 9, 0, TAU); ctx.fillStyle = '#f1b98a'; ctx.fill(); ctx.stroke();
    // head
    ctx.beginPath(); ctx.arc(0, 0, 54, 0, TAU); ctx.fillStyle = '#f1b98a'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -8, 54, Math.PI * 1.08, Math.PI * 1.92); ctx.lineTo(0, -20); ctx.closePath();
    ctx.fillStyle = '#2a1a2e'; ctx.fill();
    // brows, eyes
    ctx.lineWidth = 5; ctx.strokeStyle = INK;
    ctx.beginPath(); ctx.moveTo(-30, -16); ctx.lineTo(-10, -8); ctx.moveTo(30, -16); ctx.lineTo(10, -8); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.lineWidth = 3;
    for (const ex of [-19, 19]) { ctx.beginPath(); ctx.arc(ex, 0, 8, 0, TAU); ctx.fill(); ctx.stroke(); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ex - 3, 1, 3.5, 0, TAU); ctx.fill(); ctx.fillStyle = '#fff'; }
    // mustache
    ctx.fillStyle = '#2a1a2e';
    ctx.beginPath(); ctx.moveTo(0, 14); ctx.quadraticCurveTo(-24, 6, -40, 22); ctx.quadraticCurveTo(-20, 28, 0, 24);
    ctx.quadraticCurveTo(20, 28, 40, 22); ctx.quadraticCurveTo(24, 6, 0, 14); ctx.fill();
    // mouth
    ctx.beginPath(); ctx.ellipse(0, 36, 14 + w * 4, 5 + w * 9, 0, 0, TAU); ctx.fillStyle = '#7a1f2b'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    ctx.restore();
    outText('ХАНГЕЛЬДИ', x, y - 66, 18, '#ffe27a', 5);
  }

  function drawGoo(g) {
    const vl = Math.hypot(g.vx, g.vy) || 1, nx = g.vx / vl, ny = g.vy / vl;
    for (let i = 3; i >= 1; i--) {
      ctx.fillStyle = 'rgba(255,217,59,' + (0.5 - i * 0.12).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(g.x - nx * i * 9, g.y - ny * i * 9, 8 - i * 1.5, 0, TAU); ctx.fill();
    }
    const r = 9 + Math.sin(time * 14 + g.ph) * 1.5;
    ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, TAU);
    ctx.fillStyle = '#ffd93b'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(g.x - 3, g.y - 3, 2.6, 0, TAU); ctx.fill();
  }

  function drawBoss2() {
    if (boss2.ph === 'off' || boss2.ph === 'wait') return;
    const xs = boss2.ph === 'attack' ? 1 + 0.12 * Math.cos(boss2.u * TAU) : 1;
    const flap = Math.sin(time * (boss2.ph === 'attack' ? 7 : 18)) * 0.5;
    const o = boss2.open;
    ctx.save();
    ctx.translate(boss2.x, boss2.y);
    ctx.scale(xs, 1 / xs);
    ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = INK;
    // wings
    for (const sg of [-1, 1]) {
      ctx.save(); ctx.translate(8, -10); ctx.rotate(sg * (0.5 + flap));
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(8, -70 * sg * 1); ctx.lineTo(30, -40 * sg); ctx.lineTo(34, -10 * sg); ctx.closePath();
      ctx.fillStyle = '#5a37a6'; ctx.fill(); ctx.stroke(); ctx.restore();
    }
    // body
    ctx.beginPath(); ctx.arc(0, 0, 48, 0, TAU); ctx.fillStyle = '#7b4fc9'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(6, 16, 28, 26, 0, 0, TAU); ctx.fillStyle = '#b99af0'; ctx.fill();
    // brows + eyes
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-30, -26); ctx.lineTo(-8, -16); ctx.moveTo(4, -16); ctx.lineTo(22, -26); ctx.stroke();
    ctx.lineWidth = 3; ctx.fillStyle = '#fff';
    for (const ex of [-20, 12]) {
      ctx.beginPath(); ctx.arc(ex, -8, 9, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ex - 4, -7, 4, 0, TAU); ctx.fill(); ctx.fillStyle = '#fff';
    }
    // beak (opens when shooting)
    ctx.fillStyle = '#ffb627'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-40, 8 - o * 6); ctx.lineTo(-72, 14 - o * 10); ctx.lineTo(-38, 22 - o * 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-38, 22 + o * 2); ctx.lineTo(-66, 28 + o * 12); ctx.lineTo(-36, 34 + o * 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    if (o > 0) { ctx.fillStyle = '#ffd93b'; ctx.beginPath(); ctx.arc(-56, 22, 5 + o * 5, 0, TAU); ctx.fill(); }
    ctx.restore();
    outText('ГРИФИН', boss2.x, boss2.y - 70, 18, '#ffe27a', 5);
  }

  function draw() {
    const gy = H - GROUND;
    const sk = skinById(skinId);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);

    const sky = ctx.createLinearGradient(0, 0, 0, gy);
    sky.addColorStop(0, '#74c6f1');
    sky.addColorStop(1, '#e3f6ff');
    ctx.fillStyle = sky;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    ctx.fillStyle = 'rgba(255,238,170,0.9)';
    ctx.beginPath();
    ctx.arc(284, 104, 30, 0, TAU);
    ctx.fill();

    for (const c of clouds) cloud(c);
    hills(scroll * 0.15, 22, gy - 48, '#a9ddc6');
    hills(scroll * 0.35 + 100, 16, gy - 22, '#8bcdb0');

    for (const p of pipes) {
      const top = p.gap - GAP / 2, bot = p.gap + GAP / 2;
      // Simple borderless pipe columns, without framed/capped lips.
      pipeBlock(p.x, -6, PIPE_W, top + 6);
      pipeBlock(p.x - 4, top - CAP_H, PIPE_W + 8, CAP_H);
      pipeBlock(p.x, bot, PIPE_W, gy - bot + 6);
      pipeBlock(p.x - 4, bot, PIPE_W + 8, CAP_H);
    }

    for (const c of coins) {
      coinIcon(c.x, c.y, COIN_R, Math.max(0.18, Math.abs(Math.cos(time * 4 + c.ph))));
    }

    // ground
    ctx.fillStyle = C.sand;
    ctx.fillRect(-10, gy, W + 20, GROUND + 10);
    ctx.fillStyle = C.sandDark;
    const off = scroll % 28;
    for (let x = -off - 14; x < W + 28; x += 28) {
      ctx.beginPath();
      ctx.moveTo(x, gy + 16); ctx.lineTo(x + 14, gy + 16);
      ctx.lineTo(x + 4, gy + GROUND + 10); ctx.lineTo(x - 10, gy + GROUND + 10);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = '#7ccf6a';
    ctx.fillRect(-10, gy, W + 20, 14);
    ctx.fillStyle = '#4aa84e';
    ctx.fillRect(-10, gy + 11, W + 20, 3);
    // Remove dark framing lines from the ground edge.

    // Prime light trail
    if (sk.style === 'prime' && state !== 'dead') {
      for (let i = 1; i <= 5; i++) {
        const idx = yHist.length - 1 - i * 2;
        const yy = idx >= 0 ? yHist[idx] : doni.y;
        ctx.fillStyle = 'rgba(53,242,255,' + (0.34 - i * 0.055).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(DONI_X - 12 - i * 11, yy, 9 - i * 1.2, 0, TAU);
        ctx.fill();
      }
    }

    drawBoss();
    for (const f of franks) drawFrank(f);
    drawBoss2();
    for (const g of goos) drawGoo(g);

    ctx.save();
    if (invuln > 0 && Math.floor(time * 14) % 2 === 0) ctx.globalAlpha = 0.35;
    drawDoni(DONI_X, doni.y, doni.rot, phase, state === 'dead', sk);
    ctx.restore();

    if (drops.length) {
      for (const d of drops) {
        ctx.globalAlpha = clamp((d.life - d.t) / 0.3, 0, 1);
        ctx.fillStyle = '#d4242a';
        ctx.beginPath();
        if (d.splat) ctx.ellipse(d.x, d.y, d.r * 1.6, d.r * 0.5, 0, 0, TAU);
        else ctx.ellipse(d.x, d.y, d.r * 0.85, d.r * 1.1, Math.atan2(d.vy, d.vx) - Math.PI / 2, 0, TAU);
        ctx.fill();
        if (d.r > 3.5 && !d.splat) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(d.x - d.r * 0.3, d.y - d.r * 0.3, d.r * 0.25, 0, TAU); ctx.fill(); }
      }
      ctx.globalAlpha = 1;
    }
    for (const p of pops) {
      ctx.save();
      ctx.globalAlpha = clamp(1 - p.t / 0.7, 0, 1);
      outText('+' + p.v, p.x, p.y - 16 - p.t * 36, 22, '#ffe27a', 5);
      ctx.restore();
    }

    // HUD
    coinIcon(24, 28, 11, 1);
    outText(String(wallet), 42, 36, 24, '#fff', 5, 'left');
    piggy(42 + ctx.measureText(String(wallet)).width + 34, 28, piggyBounce);
    if (maxLives > 1) {
      for (let i = 0; i < maxLives; i++) {
        outText('♥', 12 + i * 26, 70, 26, i < lives ? '#ff3b5c' : 'rgba(255,255,255,0.5)', 5, 'left');
      }
    }
    if (state === 'playing' || (state === 'dead' && deadT <= 0.35)) {
      outText(String(score), W / 2, 92, 58, '#fff', 8);
    }

    if (state === 'ready') {
      outText('Нажми, чтобы взлететь', W / 2, 190, 28, '#fff', 7);
      ctx.font = '700 15px Nunito, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = INK;
      ctx.fillText('тап · клик · пробел', W / 2, 218);
      if (best > 0) ctx.fillText('Рекорд: ' + best, W / 2, 242);
    }

    if (state === 'dead' && deadT > 0.35) {
      const a = clamp((deadT - 0.35) / 0.3, 0, 1);
      const affordable = SKINS.some((s) => !owned.has(s.id) && wallet >= s.price) ||
        (boost < UPGRADE_MAX && wallet >= upgradeCost(boost));
      ctx.save();
      ctx.globalAlpha = a;
      const oy = (1 - a) * 24;
      const px = W / 2 - 124, py = 138 + oy;
      ctx.fillStyle = C.paper;
      rr(px, py, 248, 270, 22);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = INK;
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = INK;
      ctx.font = '30px ' + FONT;
      ctx.fillText('Конец полёта', W / 2, py + 46);

      ctx.font = '800 14px Nunito, system-ui, sans-serif';
      ctx.fillText('СЧЁТ', W / 2 - 52, py + 78);
      ctx.fillText('РЕКОРД', W / 2 + 52, py + 78);
      ctx.font = '40px ' + FONT;
      ctx.fillText(String(score), W / 2 - 52, py + 118);
      ctx.fillText(String(best), W / 2 + 52, py + 118);

      ctx.font = '800 15px Nunito, system-ui, sans-serif';
      ctx.fillStyle = INK;
      ctx.fillText('Монет за заход: +' + runCoins, W / 2, py + 144);
      if (newBest) {
        ctx.fillStyle = '#d4492a';
        ctx.fillText('Новый рекорд!', W / 2, py + 165);
      }
      if (affordable) {
        ctx.fillStyle = '#1f7a55';
        ctx.fillText('Хватает на покупку в магазине', W / 2, py + 186);
      }

      ctx.fillStyle = C.doni;
      rr(W / 2 - 80, py + 202, 160, 46, 23);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = INK;
      ctx.stroke();
      outText('Ещё раз', W / 2, py + 234, 24, '#fff', 5);
      ctx.restore();
    }

    if (boss3.phase !== 'off' && boss3.phase !== 'done') {
      ctx.save(); ctx.translate(boss3.x,boss3.y); const bs=boss3.phase==='eat'?1.7:1.35; ctx.scale(bs,bs); ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.fillStyle='#d94b37';ctx.beginPath();ctx.ellipse(0,0,72,62,0,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='#ffb17a';ctx.beginPath();ctx.ellipse(-8,20,40,28,0,0,TAU);ctx.fill();ctx.fillStyle='#fff';for(const ex of [-25,18]){ctx.beginPath();ctx.arc(ex,-20,17,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle=INK;ctx.beginPath();ctx.arc(ex+4,-18,7,0,TAU);ctx.fill();ctx.fillStyle='#fff';}ctx.fillStyle='#ffcc36';ctx.beginPath();ctx.moveTo(-48,5);ctx.lineTo(-92,12);ctx.lineTo(-48,28);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
      if(boss3.phase==='eat'){ctx.globalAlpha=clamp(boss3.t/1.5,0,1);drawDoni(boss3.x-40,boss3.y+4,0,phase,false,sk);ctx.globalAlpha=1;}
      if(boss3.phase==='fade'||boss3.phase==='world'){ctx.fillStyle='rgba(0,0,0,'+clamp(boss3.phase==='fade'?boss3.t/2:1-boss3.t/2,0,1)+')';ctx.fillRect(0,0,W,H);}
      if(boss3.phase==='world'){ctx.fillStyle='#fff';ctx.font='34px '+FONT;ctx.textAlign='center';ctx.fillText('МИР ХАНГЕЛЬДИ',W/2,H/2);}
    }
    if (boss3.phase==='done'){ctx.fillStyle='#172a44';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='34px '+FONT;ctx.textAlign='center';ctx.fillText('МИР ХАНГЕЛЬДИ',W/2,H/2);}
    ctx.restore();
    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (clamp(flash / 0.28, 0, 1) * 0.7).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---- shop ----
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function drawPreview(cv, skin, size) {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(size * dpr);
    cv.height = Math.round(size * dpr);
    cv.style.width = size + 'px';
    cv.style.height = size + 'px';
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bg = g.createLinearGradient(0, 0, 0, size);
    if (skin.wide) { bg.addColorStop(0, '#1a2040'); bg.addColorStop(1, '#080a14'); }
    else { bg.addColorStop(0, '#bfe8fb'); bg.addColorStop(1, '#e8f8ff'); }
    g.fillStyle = bg;
    g.fillRect(0, 0, size, size);
    const prev = ctx;
    ctx = g;
    ctx.save();
    ctx.translate(size * 0.6, size * 0.54);
    ctx.scale(size / 74, size / 74);
    drawDoni(0, 0, -0.12, 0.9, false, skin);
    ctx.restore();
    ctx = prev;
  }

  function renderSkins() {
    shopBody.replaceChildren();
    for (const s of SKINS) {
      const isOwned = owned.has(s.id), isOn = skinId === s.id, prime = !!s.wide;
      const card = el('article', 'card' + (prime ? ' prime' : '') + (isOn ? ' on' : ''));
      card.dataset.id = s.id;
      const cv = el('canvas');
      cv.setAttribute('aria-hidden', 'true');
      card.appendChild(cv);
      drawPreview(cv, s, prime ? 112 : 96);

      const info = el('div', 'info');
      info.appendChild(el('h3', null, s.name));
      if (s.perk) info.appendChild(el('p', 'perk', s.perk));
      if (s.desc) info.appendChild(el('p', 'desc', s.desc));
      const price = el('p', 'price');
      if (s.price === 0) price.textContent = 'Бесплатно';
      else if (isOwned) price.textContent = 'Куплено';
      else {
        if (s.originalPrice) {
          const old = el('span', 'old-price', String(s.originalPrice));
          price.appendChild(old);
          price.appendChild(el('span', 'sale-tag', 'СКИДКА'));
        }
        price.appendChild(el('i', 'coin-dot'));
        price.appendChild(document.createTextNode(String(s.price)));
      }
      info.appendChild(price);

      const btn = el('button', 'btn');
      btn.type = 'button';
      if (isOn) { btn.textContent = 'Надето'; btn.disabled = true; }
      else if (isOwned) { btn.textContent = 'Надеть'; btn.addEventListener('click', () => equip(s.id)); }
      else if (wallet >= s.price) { btn.textContent = 'Купить'; btn.classList.add('primary'); btn.addEventListener('click', () => buy(s.id)); }
      else { btn.textContent = 'Нужно ещё ' + (s.price - wallet); btn.disabled = true; }
      info.appendChild(btn);

      card.appendChild(info);
      shopBody.appendChild(card);
    }
  }

  function coinsLabel(n) { return n + (n === 1 ? ' coin' : ' coins'); }

  function renderUpgrade() {
    upgradePanel.replaceChildren();
    const maxed = boost >= UPGRADE_MAX;
    const card = el('article', 'card boost');
    card.dataset.id = 'upgrade';

    const head = el('div', 'boost-head');
    const badge = el('div', 'boost-coin', '×' + coinValue());
    badge.setAttribute('aria-hidden', 'true');
    head.appendChild(badge);
    const titles = el('div');
    titles.appendChild(el('h3', null, 'Coin Boost'));
    titles.appendChild(el('p', 'desc', 'Every coin you pick up is worth more.'));
    head.appendChild(titles);
    card.appendChild(head);

    card.appendChild(el('p', 'rate', 'Now: 1 coin = ' + coinsLabel(coinValue())));
    card.appendChild(el('p', 'rate next', maxed ? 'Maximum level reached' : 'Next: 1 coin = ' + coinsLabel(coinValue() + 1)));

    const bar = el('div', 'levels');
    bar.setAttribute('role', 'img');
    bar.setAttribute('aria-label', 'Level ' + boost + ' of ' + UPGRADE_MAX);
    for (let i = 0; i < UPGRADE_MAX; i++) bar.appendChild(el('i', i < boost ? 'on' : ''));
    card.appendChild(bar);
    card.appendChild(el('p', 'lvl', 'Level ' + boost + ' / ' + UPGRADE_MAX));

    const btn = el('button', 'btn');
    btn.type = 'button';
    if (maxed) {
      btn.textContent = 'MAX';
      btn.disabled = true;
    } else {
      const cost = upgradeCost(boost);
      const price = el('p', 'price');
      price.appendChild(document.createTextNode('Price '));
      price.appendChild(el('i', 'coin-dot'));
      price.appendChild(document.createTextNode(String(cost)));
      card.appendChild(price);
      if (wallet >= cost) { btn.textContent = 'Upgrade'; btn.classList.add('primary'); btn.addEventListener('click', buyUpgrade); }
      else { btn.textContent = 'Need ' + (cost - wallet) + ' more'; btn.disabled = true; }
    }
    card.appendChild(btn);
    upgradePanel.appendChild(card);
    upgradePanel.appendChild(el('p', 'note',
      'Each upgrade adds +1 coin per pickup. The price rises by ' + UPGRADE_STEP + ' every level. ' + UPGRADE_MAX + ' levels max.'));
  }

  function renderShop(focusId) {
    shopCoins.textContent = String(wallet);
    renderSkins();
    renderUpgrade();
    const onSkins = activeTab === 'skins';
    shopBody.hidden = !onSkins;
    upgradePanel.hidden = onSkins;
    tabSkins.setAttribute('aria-selected', String(onSkins));
    tabUpgrade.setAttribute('aria-selected', String(!onSkins));
    tabSkins.tabIndex = onSkins ? 0 : -1;
    tabUpgrade.tabIndex = onSkins ? -1 : 0;
    if (focusId) {
      const root = onSkins ? shopBody : upgradePanel;
      const b = root.querySelector('[data-id="' + focusId + '"] button:not(:disabled)');
      if (b) b.focus(); else shopClose.focus();
    }
  }

  function setTab(name, focusTab) {
    activeTab = name;
    renderShop();
    if (focusTab) (name === 'skins' ? tabSkins : tabUpgrade).focus();
  }

  function buyUpgrade() {
    if (boost >= UPGRADE_MAX) return;
    const cost = upgradeCost(boost);
    if (wallet < cost) return;
    wallet -= cost;
    boost++;
    persist();
    sfx.buy();
    shopMsg.textContent = 'Coin Boost level ' + boost + '. Each coin is now worth ' + coinValue() + '.';
    renderShop('upgrade');
  }

  function buy(id) {
    const s = skinById(id);
    if (owned.has(id) || wallet < s.price) return;
    wallet -= s.price;
    owned.add(id);
    skinId = id;
    persist();
    sfx.buy();
    shopMsg.textContent = 'Куплено и надето: ' + s.name;
    renderShop(id);
  }

  function equip(id) {
    if (!owned.has(id)) return;
    skinId = id;
    persist();
    shopMsg.textContent = 'Надето: ' + skinById(id).name;
    renderShop(id);
  }

  function openShop() {
    if (state === 'playing') return;
    shopOpen = true;
    shop.hidden = false;
    renderShop();
    shopClose.focus();
  }

  function closeShop() {
    shopOpen = false;
    shop.hidden = true;
    updateMenu();
    menuShop.focus();
  }

  // ---- main menu ----
  function updateMenu() { menuCoins.textContent = String(wallet); }
  function showMenu() {
    if (state === 'playing') return;
    menuOpen = true;
    menu.hidden = false;
    updateMenu();
    playBtn.focus();
  }
  function startPlay() {
    menuOpen = false;
    menu.hidden = true;
    reset();
    stage.focus({ preventScroll: true });
  }

  // ---- inventory ----
  function renderInv(focusAct) {
    invCoins.textContent = String(wallet);
    invBody.replaceChildren();
    for (const s of SKINS) {
      if (!owned.has(s.id)) continue;
      const isOn = skinId === s.id, wide = !!s.wide;
      const card = el('article', 'card' + (wide ? ' prime' : '') + (isOn ? ' on' : ''));
      card.dataset.id = s.id;
      const cv = el('canvas');
      cv.setAttribute('aria-hidden', 'true');
      card.appendChild(cv);
      drawPreview(cv, s, wide ? 112 : 96);

      const info = el('div', 'info');
      info.appendChild(el('h3', null, s.name));
      if (s.perk) info.appendChild(el('p', 'perk', s.perk));
      if (s.desc) info.appendChild(el('p', 'desc', s.desc));

      if (s.id === 'squint') {
        info.appendChild(el('p', 'livestat', squintLives > 0 ? 'Жизни: ' + '♥'.repeat(squintLives) + ' (' + squintLives + ' / ' + LIFE_PACK + ')' : 'Жизни не куплены (1 жизнь)'));
        const lb = el('button', 'btn');
        lb.type = 'button';
        lb.dataset.act = 'lives';
        if (squintLives > 0) { lb.textContent = 'Жизни куплены'; lb.disabled = true; }
        else if (wallet >= LIFE_COST) { lb.textContent = 'Купить 3 жизни · ' + LIFE_COST; lb.classList.add('primary'); lb.addEventListener('click', buyLives); }
        else { lb.textContent = '3 жизни · ' + LIFE_COST + ' (нужно ещё ' + (LIFE_COST - wallet) + ')'; lb.disabled = true; }
        info.appendChild(lb);
      }

      const btn = el('button', 'btn');
      btn.type = 'button';
      btn.dataset.act = 'equip:' + s.id;
      if (isOn) { btn.textContent = 'Надето'; btn.disabled = true; }
      else { btn.textContent = 'Надеть'; btn.addEventListener('click', () => equipInv(s.id)); }
      info.appendChild(btn);

      card.appendChild(info);
      invBody.appendChild(card);
    }
    if (focusAct) {
      const b = invBody.querySelector('[data-act="' + focusAct + '"]:not(:disabled)');
      if (b) b.focus(); else invClose.focus();
    }
  }
  function equipInv(id) {
    if (!owned.has(id)) return;
    skinId = id;
    persist();
    invMsg.textContent = 'Надето: ' + skinById(id).name;
    renderInv('equip:' + id);
  }
  function buyLives() {
    if (!owned.has('squint') || squintLives > 0 || wallet < LIFE_COST) return;
    wallet -= LIFE_COST;
    squintLives = LIFE_PACK;
    persist();
    sfx.buy();
    invMsg.textContent = 'Куплено 3 жизни для Косоглазого Дони';
    renderInv('equip:squint');
  }
  function openInv() {
    if (state === 'playing') return;
    invOpen = true;
    inv.hidden = false;
    renderInv();
    invClose.focus();
  }
  function closeInv() {
    invOpen = false;
    inv.hidden = true;
    updateMenu();
    menuInv.focus();
  }

  function trapTab(e) {
    const panel = invOpen ? inv : shop;
    const f = Array.from(panel.querySelectorAll('button:not(:disabled)')).filter((b) => b.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], end = f[f.length - 1];
    if (!panel.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); end.focus(); }
    else if (!e.shiftKey && document.activeElement === end) { e.preventDefault(); first.focus(); }
  }

  shopBtn.addEventListener('click', showMenu);
  playBtn.addEventListener('click', startPlay);
  menuShop.addEventListener('click', openShop);
  menuInv.addEventListener('click', openInv);
  invClose.addEventListener('click', closeInv);
  inv.addEventListener('pointerdown', (e) => { if (e.target === inv) closeInv(); });
  tabSkins.addEventListener('click', () => setTab('skins', false));
  tabUpgrade.addEventListener('click', () => setTab('upgrade', false));
  document.getElementById('shopTabs').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'Home' || e.key === 'End') {
      e.preventDefault();
      let next = activeTab === 'skins' ? 'upgrade' : 'skins';
      if (e.key === 'Home') next = 'skins';
      if (e.key === 'End') next = 'upgrade';
      setTab(next, true);
    }
  });
  shopClose.addEventListener('click', closeShop);
  shop.addEventListener('pointerdown', (e) => { if (e.target === shop) closeShop(); });

  // ---- sizing ----
  let scale = 1;
  function fit() {
    const availW = Math.max(120, stage.clientWidth);
    const availH = Math.max(200, stage.clientHeight);
    const w = Math.min(availW, availH * (W / H));
    const h = w * (H / W);
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    scale = canvas.width / W;
  }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  window.addEventListener('resize', fit);

  // ---- loop ----
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.033, Math.max(0, (t - last) / 1000));
    last = t;
    if (!shopOpen && !invOpen) {
      update(dt);
      if (state !== 'dead') {
        yHist.push(doni.y);
        if (yHist.length > 16) yHist.shift();
      }
    }
    draw();
    requestAnimationFrame(frame);
  }
  startLives();
  updateMenu();
  syncUI();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
